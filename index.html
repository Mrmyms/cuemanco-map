<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mercado de Plantas y Flores Cuemanco · Mapa Interactivo</title>
  <meta name="description" content="Croquis interactivo del Mercado de Plantas y Flores de Cuemanco en Xochimilco. Explora zonas, manzanas, viveros verificados, talleres botánicos, sanitarios y accesos con búsqueda inteligente.">
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Contenedor Principal de la Aplicación -->
  <div id="app" class="market-app-container">

    <!-- Barra Superior Unificada: Buscador + Categorías a la derecha + Controles -->
    <header class="top-nav-overlay">
      <div class="search-box-container">
        <div class="search-input-wrapper">
          <div class="search-icon-badge" title="Buscar en Cuemanco">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar: Yura, D'raiz, IMFFSS, tacos, baños, macetas, zonas..."
            autocomplete="off"
            spellcheck="false"
          >
          <button id="search-clear-btn" class="btn-clear-search" title="Borrar búsqueda" style="display: none;">
            ✕
          </button>
        </div>

        <!-- Menú Desplegable de Sugerencias y Autocompletado -->
        <div id="search-dropdown" class="search-dropdown-menu" style="display: none;"></div>
      </div>

      <!-- Barra de Filtros Rápidos por Categoría Botánica (Ubicada a la derecha del buscador) -->
      <nav class="category-scroll-bar" id="category-bar" aria-label="Categorías botánicas"></nav>
    </header>

    <!-- Contenedor del Mapa Leaflet Interactivo -->
    <main id="cuemanco-map" class="map-canvas-viewport"></main>

    <!-- Controles Flotantes del Mapa (Esquina Inferior Derecha: Centrar + Zoom In/Out) -->
    <div class="bottom-right-map-controls" aria-label="Controles de navegación del mapa">
      <button id="reset-view-btn" class="map-ctrl-circle-btn" title="Centrar Mercado Completo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="5"></line>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="5" y2="12"></line>
          <line x1="19" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>

      <div class="zoom-btn-group">
        <button id="zoom-in-btn" class="zoom-ctrl-btn" title="Acercar mapa (+)">
          <span>+</span>
        </button>
        <div class="zoom-divider"></div>
        <button id="zoom-out-btn" class="zoom-ctrl-btn" title="Alejar mapa (−)">
          <span>−</span>
        </button>
      </div>
    </div>

    <!-- Panel Lateral Deslizable / Drawer (Estilo Google Maps & HoYoLAB) -->
    <aside id="side-drawer" class="side-detail-drawer" aria-label="Ficha de local">
      <button id="drawer-close-btn" class="drawer-close-floating" title="Cerrar panel">
        ✕
      </button>
      <div id="drawer-content" class="drawer-scroll-container">
        <!-- El contenido se inyecta dinámicamente con ui.js -->
      </div>
    </aside>

    <!-- Control flotante de Capas y Leyenda del Mapa (Esquina Inferior Izquierda) -->
    <section id="map-layers-panel" class="map-layers-dock" aria-label="Capas del mapa">
      <button id="layers-toggle-btn" class="layers-dock-header" type="button" aria-expanded="true">
        <span class="layers-dock-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span>Cuemanco · Capas</span>
        </span>
        <span class="layers-dock-chevron" aria-hidden="true">▾</span>
      </button>

      <div id="layers-dock-body" class="layers-dock-body">
        <label class="layer-toggle-item">
          <input type="checkbox" data-layer="zonas" checked>
          <span class="layer-swatch layer-swatch-zonas"></span>
          <span>Zonas y Manzanas</span>
        </label>
        <label class="layer-toggle-item">
          <input type="checkbox" data-layer="locales" checked>
          <span class="layer-swatch layer-swatch-locales"></span>
          <span>Locales</span>
        </label>
        <label class="layer-toggle-item">
          <input type="checkbox" data-layer="sanitarios" checked>
          <span class="layer-swatch layer-swatch-wc"></span>
          <span>Sanitarios (6)</span>
        </label>
        <label class="layer-toggle-item">
          <input type="checkbox" data-layer="accesos" checked>
          <span class="layer-swatch layer-swatch-accesos"></span>
          <span>Accesos y P</span>
        </label>
      </div>
    </section>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
